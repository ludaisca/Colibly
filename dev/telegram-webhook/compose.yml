name: colibly-telegram-dev

services:
  gateway:
    image: docker.io/library/nginx:alpine
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./.htpasswd:/etc/nginx/dev.htpasswd:ro,z
    restart: unless-stopped

  tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    network_mode: host
    command: tunnel --no-autoupdate --url http://127.0.0.1:18150
    depends_on:
      - gateway
    restart: unless-stopped
