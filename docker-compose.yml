services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Debes definir DB_PASSWORD en el entorno}"
      POSTGRES_DB: colibly_db
    volumes:
      # pgdata_v2: el volumen anterior quedó a medias (el primer arranque se
      # marcó unhealthy a mitad del initdb). Postgres ya no vuelve a crear
      # colibly_db en un directorio inicializado, y psql sale con código 2.
      - pgdata_v2:/var/lib/postgresql/data
    # Sin montar docker/init.sql: en Coolify el repo se clona dentro de un contenedor
    # auxiliar, así que ese archivo no existe en el host, Docker crea un DIRECTORIO
    # con ese nombre y Postgres falla al ejecutarlo. La extensión vector la crea
    # el servicio db-init de abajo.
    healthcheck:
      # El primer arranque de pgvector inicializa el volumen; sin start_period
      # Compose lo marca unhealthy a los ~25 s y aborta el despliegue.
      test: ["CMD-SHELL", "pg_isready -U postgres -d colibly_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  db-init:
    image: pgvector/pgvector:pg16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: "${DB_PASSWORD:?Debes definir DB_PASSWORD en el entorno}"
    command:
      - sh
      - -c
      - |
        set -e
        i=0
        until pg_isready -h db -U postgres -d postgres; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then
            echo "db-init: no hay conexión a db" >&2
            exit 2
          fi
          sleep 2
        done
        psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = 'colibly_db'" | grep -q 1 \
          || psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE colibly_db"
        psql -h db -U postgres -d colibly_db -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
    restart: "no"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      target: runner
    expose:
      - "5000"
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:?Debes definir DB_PASSWORD en el entorno}@db:5432/colibly_db"
      AUTH_SECRET: "${AUTH_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: "${NODE_ENV:-production}"
      # Integración Google Sheets (opcional) — sin este passthrough las vars
      # definidas en Coolify solo servían para sustitución del compose, nunca
      # llegaban al proceso Node y la integración quedaba muerta en producción.
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_OAUTH_REDIRECT_URI: "${GOOGLE_OAUTH_REDIRECT_URI:-}"
      MEDIA_RETENTION_DAYS: "${MEDIA_RETENTION_DAYS:-90}"
      # URL pública (enlaces de correos y de Stripe) — infraestructura de
      # arranque, se queda en env. IA, Stripe, SMTP, Turnstile y medición ya NO
      # son env vars: se configuran desde /plataforma → PlatformSettings
      # (lib/platform-settings.ts), cifradas en base de datos.
      APP_URL: "${APP_URL:-}"
      # IP confiable para límites anti-abuso: vacío = X-Real-Ip de Traefik (ver lib/net/client-ip.ts).
      TRUSTED_CLIENT_IP_HEADER: "${TRUSTED_CLIENT_IP_HEADER:-}"
      SITE_URL: "${SITE_URL:-}"
      # Opcional: origen HTTPS exclusivo para webhooks de Telegram en DEV.
      TELEGRAM_WEBHOOK_BASE_URL: "${TELEGRAM_WEBHOOK_BASE_URL:-}"
      WHATSAPP_WEBHOOK_BASE_URL: "${WHATSAPP_WEBHOOK_BASE_URL:-}"
      # Cuenta de chat web (propia) que se muestra en la landing.
      LANDING_WEBCHAT_ACCOUNT_ID: "${LANDING_WEBCHAT_ACCOUNT_ID:-}"
      # Operadores de la plataforma (panel /plataforma): perímetro de acceso,
      # deliberadamente fuera de la base de datos — ver lib/platform-admin.ts.
      PLATFORM_ADMIN_EMAILS: "${PLATFORM_ADMIN_EMAILS:-}"
      # Pool de Postgres por proceso (vacío = default de Prisma). Ver lib/prisma.ts.
      DB_CONNECTION_LIMIT: "${DB_CONNECTION_LIMIT:-}"
      DB_POOL_TIMEOUT: "${DB_POOL_TIMEOUT:-}"
      # Límites de la API pública y webhooks (vacío = default de lib/api/constants.ts).
      API_RATE_LIMIT_PER_KEY: "${API_RATE_LIMIT_PER_KEY:-}"
      API_RATE_LIMIT_PER_ORG: "${API_RATE_LIMIT_PER_ORG:-}"
      API_RATE_LIMIT_PER_IP: "${API_RATE_LIMIT_PER_IP:-}"
      API_RATE_LIMIT_SEND_PER_ORG: "${API_RATE_LIMIT_SEND_PER_ORG:-}"
      API_RATE_LIMIT_CONVERSATIONS_PER_KEY: "${API_RATE_LIMIT_CONVERSATIONS_PER_KEY:-}"
      API_RATE_LIMIT_WEBHOOK_REPLAYS_PER_ORG: "${API_RATE_LIMIT_WEBHOOK_REPLAYS_PER_ORG:-}"
      API_DAILY_SEND_CAP_PER_ORG: "${API_DAILY_SEND_CAP_PER_ORG:-}"
      API_MAX_BODY_BYTES: "${API_MAX_BODY_BYTES:-}"
      API_AUTH_CACHE_SECONDS: "${API_AUTH_CACHE_SECONDS:-}"
      WEBHOOK_WORKER_CONCURRENCY: "${WEBHOOK_WORKER_CONCURRENCY:-}"
      WEBHOOK_PER_ENDPOINT_CONCURRENCY: "${WEBHOOK_PER_ENDPOINT_CONCURRENCY:-}"
    healthcheck:
      # 127.0.0.1, no "localhost": dentro del contenedor localhost resuelve a
      # ::1 primero y next-server solo escucha en IPv4 — con localhost el
      # healthcheck falla siempre con "Connection refused" aunque la app esté bien.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    restart: unless-stopped

volumes:
  pgdata_v2:
  media_data:
