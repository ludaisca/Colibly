name: Nodo n8n

# Lint, build y pruebas del paquete n8n-nodes-colibly. Solo corre cuando cambia
# integrations/n8n. Publicar en npm se hace a mano (npm publish --access public).
on:
  push:
    branches: [main]
    paths: ["integrations/n8n/**", "integrations/n8n-tests/**"]
  pull_request:
    paths: ["integrations/n8n/**", "integrations/n8n-tests/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/n8n
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/n8n/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
