# Verificación de cada push y PR: lo mismo que se corre a mano antes de un
# commit (tsc, eslint, vitest) y el build de producción tal como lo hace
# Coolify (etapa `builder` del Dockerfile). En main, además, publica la imagen
# de producción en GHCR (job `image`). No despliega nada.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: tsc · lint · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # tsconfig.tsbuildinfo no se versiona: sin esa caché incremental, tsc supera el
      # heap por defecto de ~2 GB del runner y aborta con "heap out of memory".
      - run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run lint
      - run: npm test

  build:
    name: Build de producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Imagen de producción (etapa runner) en GHCR, para que el servidor descargue
  # la imagen en vez de construirla (los builds de ~7 min eran los únicos picos
  # de CPU del servidor de producción). Etiquetas: el sha del commit y `main`.
  # Cambiar Coolify a esta imagen está en docs/AUDITORIA_CODIGO_Y_RUST_2026-11-19.md.
  image:
    name: Imagen de producción (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/colibly:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/colibly:main
          build-args: |
            APP_URL=${{ vars.APP_URL || 'https://app.colibly.com' }}
            SITE_URL=${{ vars.SITE_URL || 'https://colibly.com' }}
            NEXT_PUBLIC_APP_URL=${{ vars.APP_URL || 'https://app.colibly.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
