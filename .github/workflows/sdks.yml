name: SDKs

# Pruebas de los clientes de la API (integrations/sdk-node y sdk-python).
# Publicar en npm y PyPI se hace a mano.
on:
  push:
    branches: [main]
    paths: ["integrations/sdk-node/**", "integrations/sdk-python/**"]
  pull_request:
    paths: ["integrations/sdk-node/**", "integrations/sdk-python/**"]

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/sdk-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
