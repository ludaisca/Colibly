[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colibly"
version = "0.1.1"
description = "Cliente oficial de la API de Colibly (CRM para WhatsApp): contactos, conversaciones, mensajes, plantillas, llamadas y verificación de webhooks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Colibly", email = "contacto@colibly.com" }]
keywords = ["colibly", "whatsapp", "crm", "api", "sdk"]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://app.colibly.com/docs/api"
