[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colibly"
version = "0.1.0"
description = "Cliente oficial de la API de Colibly (CRM para WhatsApp): contactos, conversaciones, mensajes, plantillas, llamadas y verificación de webhooks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://app.colibly.com/docs/api"
Repository = "https://github.com/ludaisca/Colibly"
