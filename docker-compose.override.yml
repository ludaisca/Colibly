# Nombre fijo del proyecto de desarrollo (contenedores colibly-*, volúmenes
# colibly_*), sin depender del nombre de la carpeta. Coolify no usa este archivo.
name: colibly

services:
  app:
    # Producción usa la imagen de GHCR; en dev se construye la etapa dev.
    image: colibly-app:dev
    pull_policy: build
    build:
      context: .
      target: dev
    ports:
      - "1100:5000"
    volumes:
      - .:/app:z
      - /app/node_modules
      - media_data:/app/media
    env_file: .env
    environment:
      NODE_ENV: development
      # En dev las colas corren en el mismo proceso (en producción, servicio worker).
      COLIBLY_WORKERS: "1"
      # Correo de desarrollo: todo lo que la app envía cae en Mailpit
      # (http://localhost:1101), nunca en bandejas reales.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: "Colibly <noreply@colibly.com>"
    command: >
      sh -c "npx prisma generate && sh scripts/db-migrate.sh && mkdir -p /app/media && npm run dev"

  # El worker de producción no se levanta en dev: las colas van en app.
  worker:
    profiles: ["prod-worker"]

  mailpit:
    image: docker.io/axllent/mailpit:v1.27
    ports:
      - "1101:8025"
    restart: unless-stopped

volumes:
  media_data:
