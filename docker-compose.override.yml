services:
  app:
    build:
      target: dev
    ports:
      - "15100:5000"
    volumes:
      - .:/app:z
      - /app/node_modules
      - media_data:/app/media
    env_file: .env
    environment:
      NODE_ENV: development
    command: >
      sh -c "npx prisma generate && sh scripts/db-migrate.sh && mkdir -p /app/media && npm run dev"

volumes:
  media_data:
