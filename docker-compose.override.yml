# Nombre fijo del proyecto de desarrollo (contenedores colibly-*, volúmenes
# colibly_*), sin depender del nombre de la carpeta. Coolify no usa este archivo.
name: colibly

services:
  app:
    build:
      target: dev
    ports:
      - "1100:5000"
    volumes:
      - .:/app:z
      - /app/node_modules
      - media_data:/app/media
    env_file: .env
    environment:
      NODE_ENV: development
      # Correo de desarrollo: todo lo que la app envía cae en Mailpit
      # (http://localhost:1101), nunca en bandejas reales.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: "Colibly <noreply@colibly.com>"
    command: >
      sh -c "npx prisma generate && sh scripts/db-migrate.sh && mkdir -p /app/media && npm run dev"

  mailpit:
    image: docker.io/axllent/mailpit:v1.27
    ports:
      - "1101:8025"
    restart: unless-stopped

volumes:
  media_data:
